  <title>eCobOne — Redirecionando...</title>
  <script>

      var ua = (navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase();
      var isMobileUA = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua);
      var isSmallScreen = window.innerWidth <= 768;

      if (isMobileUA || isSmallScreen) {
        window.location.replace("eCobOne/m/index.html");
      } else {
        window.location.replace("eCobOne/index.html");
      }
    })();
  </script>
</head>
